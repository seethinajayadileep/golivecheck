name: www-seethinajayadileep
# Phase 2 owned host: the live website. Cheap gate: security + a11y + API.
target: https://www.seethinajayadileep.dev
allow:
  - www.seethinajayadileep.dev
budget:
  maxMinutes: 8
  maxLlmCalls: 0
jobs:
  - type: security
    name: baseline
    url: /
  - type: a11y
    name: home
    url: /
    tags: [wcag2aa]
  - type: api
    name: health
    requests:
      - { method: GET, path: /, expectStatus: 200 }
