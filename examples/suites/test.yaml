name: test-seethinajayadileep
# Phase 2 owned host: named subdomain (not www — www is the live site).
# Only this host is allowlisted. Cheap gate: security + a11y + API.
target: https://test.seethinajayadileep.dev
allow:
  - test.seethinajayadileep.dev
budget:
  maxMinutes: 8
  maxLlmCalls: 0
jobs:
  - type: security
    name: baseline
    url: /
  - type: a11y
    name: home
    url: /
    tags: [wcag2aa]
  - type: api
    name: health
    requests:
      - { method: GET, path: /, expectStatus: 200 }
