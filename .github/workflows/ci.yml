name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: golivecheck-report
          path: output
          if-no-files-found: ignore
